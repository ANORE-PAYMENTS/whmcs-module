name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, intl
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Lint PHP
        run: |
          php -l modules/gateways/anore.php
          php -l modules/gateways/callback/anore.php
          php -l tests/whmcs-fixture.php
      - name: Run HTTP integration tests
        run: node tests/callback-http.mjs "$(command -v php)"

  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build reproducible release archive
        run: scripts/build-release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: whmcs-module-release
          path: dist/*
          if-no-files-found: error
